            - button [ref=f1e350] [cursor=pointer]:
              - heading "Como acontecerá a mentoria?" [level=5] [ref=f1e351]
            - paragraph [ref=f1e355]: Todos os encontros de mentoria acontecerão por meio de uma plataforma de videoconferência. Nos dias e horários agendados mentor e mentorado receberão uma notificação, via e-mail, para que acessem suas páginas pessoais e iniciem a mentoria.
